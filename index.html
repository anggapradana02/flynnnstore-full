<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flynnnstore - Galaxy Top-up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --accent: #00FFFF;
        --bg-deep: #0B011E;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-deep);
        /* Opsional: jika gambar sudah diunduh ke folder public/bg-galaxy.jpg, ganti URL di bawah menjadi url('/bg-galaxy.jpg') */
        background-image: url('https://wallpapers.com/images/hd/purple-gaming-bw9kl5n6y8edoyim.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: white;
        margin: 0;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, rgba(11, 1, 30, 0.85) 0%, rgba(11, 1, 30, 0.6) 100%);
        z-index: -1;
      }

      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .tech-gradient-text {
        background: linear-gradient(to right, #00FFFF 20%, #A855F7 80%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-style: italic;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      .animate-float { animation: float 6s ease-in-out infinite; }

      @keyframes energy-pulse {
        0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4)); transform: scale(1); }
        50% { filter: drop-shadow(0 0 45px rgba(168, 85, 247, 0.7)); transform: scale(1.03); }
      }
      .animate-energy { animation: energy-pulse 4s infinite ease-in-out; }

      @keyframes scanner {
        0% { top: -10%; }
        100% { top: 110%; }
      }
      .scan-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: #00FFFF;
        box-shadow: 0 0 15px #00FFFF;
        animation: scanner 3s linear infinite;
        z-index: 10;
        pointer-events: none;
      }

      .lightning-bolt {
        position: absolute;
        width: 2px;
        height: 100vh;
        background: linear-gradient(to bottom, transparent, #00FFFF, white, #00FFFF, transparent);
        filter: blur(1px) drop-shadow(0 0 15px #00FFFF);
        opacity: 0;
      }

      @keyframes lightning-strike {
        0%, 95% { opacity: 0; transform: scaleY(0); }
        96% { opacity: 1; transform: scaleY(1.2); }
        98% { opacity: 0.2; }
        99% { opacity: 1; transform: scaleY(1); }
        100% { opacity: 0; }
      }
      
      .bolt-1 { left: 15%; animation: lightning-strike 8s infinite 1s; }
      .bolt-2 { left: 50%; animation: lightning-strike 12s infinite 4s; }
      .bolt-3 { left: 85%; animation: lightning-strike 10s infinite 2s; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .ripple {
        position: absolute;
        background: rgba(0, 255, 255, 0.4);
        border-radius: 50%;
        transform: scale(0);
        animation: ripple-effect 0.6s linear;
        pointer-events: none;
      }
      @keyframes ripple-effect {
        to { transform: scale(4); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
      <div class="lightning-bolt bolt-1"></div>
      <div class="lightning-bolt bolt-2"></div>
      <div class="lightning-bolt bolt-3"></div>
    </div>
    <div id="root"></div>
    
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
